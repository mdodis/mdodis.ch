name: Build and Deploy Site

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS
        run: git lfs pull

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build the Blog
        run: chmod +x ./blog-src/build.sh && ./blog-src/build.sh

      # Only publish the site itself, not blog-src or repo metadata
      - name: Assemble Site
        run: |
          mkdir -p _site
          cp index.html style.css *.js _site/
          cp -r res blog _site/

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
